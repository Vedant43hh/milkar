<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />
    <title>You're offline · Milkar</title>
    <style>
      :root {
        --bg: #faf6ef;
        --surface: #ffffff;
        --fg: #211b14;
        --muted: #5c5145;
        --border: #e8dfd2;
        --brand: #0f766e;
        --brand-fg: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110d;
          --surface: #1d1914;
          --fg: #f6efe6;
          --muted: #bfb3a5;
          --border: #382f26;
          --brand: #2dd4bf;
          --brand-fg: #042f2e;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        width: 100%;
        border-radius: 14px;
        background: var(--brand);
        color: var(--brand-fg);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg aria-hidden="true" viewBox="0 0 32 32" width="48" height="48">
        <circle cx="12" cy="16" r="9" fill="#0f766e" />
        <circle cx="20" cy="16" r="9" fill="#f59e0b" opacity="0.9" />
      </svg>
      <h1>You're offline</h1>
      <p>Milkar needs a connection to show live prices, your wallet and your orders. Check your internet and try again.</p>
      <!-- An empty link reloads the page that couldn't load. -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
