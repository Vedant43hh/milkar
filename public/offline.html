<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>You're offline · Milkar</title>
    <style>
      /* A copy of the app's tokens (src/app/globals.css): this page must work offline. */
      :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --border: #e5e7eb;
        --fg: #111827;
        --muted: #6b7280;
        --accent: #166534;
        --accent-hover: #14532d;
        --accent-fg: #ffffff;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 420px;
        margin: 48px auto 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg aria-hidden="true" viewBox="0 0 38 26" width="38" height="26">
        <circle cx="13" cy="13" r="12" fill="#2f8f5b" />
        <circle cx="25" cy="13" r="12" fill="#a3d65c" />
        <path d="M19 2.608A12 12 0 0 1 19 23.392A12 12 0 0 1 19 2.608Z" fill="#6db75a" />
      </svg>
      <h1>You're offline</h1>
      <p>Milkar needs a connection to show live prices, your wallet and your orders. Check your internet and try again.</p>
      <!-- An empty link reloads the page that couldn't load. -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
