<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e0e5ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b2f36" media="(prefers-color-scheme: dark)" />
    <title>You're offline · Milkar</title>
    <style>
      /* A copy of the app's soft-UI tokens (src/app/globals.css): this page must work offline. */
      :root {
        --bg: #e0e5ec;
        --shadow-dark: #a3b1c6;
        --shadow-light: #ffffff;
        --fg: #2d3748;
        --muted: #525c6c;
        --brand: #334fa3;
        --accent-bright: #f59e0b;
        --raised: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
        --raised-sm: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        --raised-xs: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
        --pressed-sm: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2f36;
          --shadow-dark: #1f2227;
          --shadow-light: #373c45;
          --fg: #e2e8f0;
          --muted: #a0aec0;
          --brand: #9cb6ff;
          --accent-bright: #fbbf24;
          color-scheme: dark;
        }
      }
      @media (width < 40rem) {
        :root {
          --raised: var(--raised-sm);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border-radius: 16px;
        background: var(--bg);
        box-shadow: var(--raised);
        text-align: center;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        width: 100%;
        border-radius: 12px;
        background: var(--bg);
        box-shadow: var(--raised-sm);
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
        transition: box-shadow 0.2s ease;
      }
      a:hover {
        box-shadow: var(--raised-xs);
      }
      a:active {
        box-shadow: var(--pressed-sm);
      }
      a:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg aria-hidden="true" viewBox="0 0 32 32" width="48" height="48">
        <circle cx="12" cy="16" r="9" fill="var(--brand)" />
        <circle cx="20" cy="16" r="9" fill="var(--accent-bright)" opacity="0.9" />
      </svg>
      <h1>You're offline</h1>
      <p>Milkar needs a connection to show live prices, your wallet and your orders. Check your internet and try again.</p>
      <!-- An empty link reloads the page that couldn't load. -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
